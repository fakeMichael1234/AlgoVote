<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Results — {{ poll['question'] }}</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h2>Results</h2>
        <p class="question">{{ poll['question'] }}</p>
        <div class="results">
          {% for o in options %}
          {% set pct = (o['votes'] / total * 100) if total>0 else 0 %}
          <div class="result-row">
            <div class="label">{{ o['text'] }} — {{ o['votes'] }} votes — {{ '%.0f' % pct }}%</div>
            <div class="bar">
              <div class="fill" style="width: {{ pct }}%"></div>
            </div>
          </div>
          {% endfor %}
          <p class="muted">Total votes: {{ total }}</p>
          {% if not poll['active'] %}
            <p class="closed">Voting is closed.</p>
          {% else %}
            <a class="btn" href="/vote/{{ poll['id'] }}">Vote</a>
          {% endif %}
        </div>
      </section>
    </main>
  </body>
</html>
