<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin — AlgoVote</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h2>Admin Panel</h2>
        <div style="margin-top:8px;margin-bottom:12px;">
          <a class="btn" href="/">Back to Home</a>
        </div>
        {% if not logged_in %}
          <form method="post" action="/admin">
            <label>Password</label>
            <input type="password" name="password" placeholder="Admin password">
            <div class="actions">
              <button class="btn primary" type="submit">Login</button>
            </div>
          </form>
        {% else %}
          <h3>Create Poll</h3>
          <form method="post" action="/admin/create">
            <label>Question</label>
            <input type="text" name="question" placeholder="Who should be the Class Representative?">
            <label>Options</label>
            <div id="options-container">
              <input type="text" name="options" placeholder="Option 1" class="option-input">
              <input type="text" name="options" placeholder="Option 2" class="option-input">
            </div>
            <div style="margin-top:8px; margin-bottom:12px;">
              <button id="addOptionBtn" type="button" class="btn">+ Add option</button>
            </div>
            <div class="actions">
              <button class="btn primary" type="submit">Create Poll</button>
            </div>
          </form>

          <h3>Existing Polls</h3>
          {% for p in polls %}
            <div class="poll-row">
              <div>
                <strong>{{ p['question'] }}</strong>
                {% if p['active'] %}<span class="pill">Active</span>{% elif p['closed_at'] %}<span class="pill muted">Closed</span>{% endif %}
              </div>
              <div class="actions">
                <form method="post" action="/admin/activate/{{ p['id'] }}" style="display:inline">
                  <button class="btn" type="submit">Activate</button>
                </form>
                <form method="post" action="/admin/close/{{ p['id'] }}" style="display:inline">
                  <button class="btn" type="submit">Close</button>
                </form>
                <a class="btn" href="/results/{{ p['id'] }}">Results</a>
                <a class="btn" href="/admin/voters/{{ p['id'] }}">Voters</a>
              </div>
            </div>
          {% endfor %}

          <a class="btn" href="/admin/logout">Logout</a>
        {% endif %}
      </section>
    </main>
  </body>
</html>
